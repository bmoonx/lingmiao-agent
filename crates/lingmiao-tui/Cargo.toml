[package]
name = "lingmiao-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "灵妙 TUI (ratatui, Claude-Code-style) — 纯 CC 单栏（header + 对话流 + input + footer）"

[dependencies]
lingmiao-core.workspace = true
lingmiao-engine.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
ratatui.workspace = true
chrono.workspace = true
crossterm = { workspace = true, features = ["event-stream"] }
futures-util.workspace = true
tracing.workspace = true
# Un-submitted-input snapshot (`session_input.rs`): serde derives + JSON, so the
# queue/draft survive a kill.
serde.workspace = true
serde_json.workspace = true
# OSC 52 clipboard payload (base64) for in-app text selection (cli 2026-09-27).
base64.workspace = true
# Markdown → ratatui `Line`s for assistant replies (T12 富文本), self-rendered.
# We parse with `pulldown-cmark` and lay the tree out ourselves (see
# `src/markdown.rs`) so we control exactly what reaches the screen — heading
# markers stripped, real tables + rules, quote bars — unlike `tui-markdown`,
# which kept its syntax markers and could not emit tables/rules at all.
pulldown-cmark = { version = "0.13", default-features = false }
# Syntax highlighting inside fenced code blocks. `regex-onig` reuses the
# Oniguruma backend already built for `tokenizers`; `default-syntaxes` /
# `default-themes` embed the grammar + theme packs (`default-features = false`
# drops the html/plist/yaml tooling we never touch).
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-onig",
] }
